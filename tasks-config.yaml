# Named profiles for the two phases of a run: who solves a manifest, and
# who judges what it left.
#
#   uv run python main.py task --manifest 1 --profile <solve profile>
#   uv run python main.py score --manifest 1 --run <id> \
#       --score-profile <score profile>
#
# A profile is not a secret, so it is tracked. The credentials it needs are
# not: `model_env` names variables, and their values are read from `.env`.
# Every key is required in every profile (AGENTS.md rule 10); an empty list
# or mapping is a real answer, an absent key is an error.
#
# Rename a profile rather than change what it means: a run records the
# profile's name and the values it resolved to, and a name that meant
# something else last week makes old records lie.

# --- solve_profiles: who solves a manifest -------------------------------
#
#   agent            a row of src/agents/registry.py
#   agent_model      the wire name the CLI formats its requests for; a label
#                    only for react, which has no bridge
#   agent_version    the CLI version installed in the workspace; a label
#                    only for react. A CLI must know `agent_model`.
#   answer_model     the Inspect model that generates the tokens. A score is
#                    attributed to this, not to `agent_model`.
#   model_env        the variables `answer_model`'s provider reads, from .env
#   reasoning_effort none | minimal | low | medium | high | xhigh | max, set
#                    on the answering model itself
#   model_args       provider arguments for `answer_model` (Inspect's -M)
solve_profiles:
  opencode-v1-deepseek-flash-medium:
    agent: opencode
    agent_model: opencode-go/deepseek-v4.1-flash
    agent_version: 1.19.5
    answer_model: openai-api/opencode-go/deepseek-v4.1-flash
    model_env: [OPENCODE_GO_API_KEY, OPENCODE_GO_BASE_URL]
    reasoning_effort: medium
    model_args: {}

  claude-code-sonnet-5.5-medium:
    agent: claude
    agent_model: claude-sonnet-5-5
    agent_version: 2.1.311
    answer_model: anthropic/claude-sonnet-5-5
    model_env: [ANTHROPIC_API_KEY]
    reasoning_effort: medium
    model_args: {}

  # Not reliable since it has the sub usage limits
  claude-code-sonnet-5.5-medium-subscription:
    agent: claude
    agent_model: claude-sonnet-5-5
    agent_version: 2.1.311
    answer_model: anthropic/claude-sonnet-5-5
    model_env: [ANTHROPIC_AUTH_TOKEN]
    reasoning_effort: medium
    model_args: {}

  # The native agent on the same answerer and provider as
  # `opencode-v1-deepseek-flash-medium`, at `high` effort: the two profiles
  # differ in the agent and in the effort, so read a comparison between them
  # with that in mind. `agent_model` and `agent_version` stay `none` because
  # the native agent asks no bridge for a name and installs no CLI; they are
  # recorded labels, not selectors.
  react-deepseek-flash-high:
    agent: react
    agent_model: none
    agent_version: none
    answer_model: openai-api/opencode-go/deepseek-v4.1-flash
    model_env: [OPENCODE_GO_API_KEY, OPENCODE_GO_BASE_URL]
    reasoning_effort: high
    model_args: {}

  # The zero-cost smoke profile: the whole pipeline with an answerer that
  # never reaches a provider. Kept beside the real one so neither name lies
  # about which one it is. Its agent is the capped `react-mock` row: the
  # mock never calls submit(), so the cap is what ends the solve.
  react-mock:
    agent: react-mock
    agent_model: none
    agent_version: none
    answer_model: mockllm/model
    model_env: []
    reasoning_effort: none
    model_args: {}

# --- score_profiles: who judges a tree -----------------------------------
#
# `functional_parity` needs no model; `trace_similarity` asks one whether
# the spans of a case show the decoupling the work order asked for, against
# the spans the pristine pin produced. These keys configure that judge.
#
#   judge_model      the Inspect model that reads both span trees and rules.
#                    A trace verdict is attributed to it, so keep it fixed
#                    across the runs you compare.
#   model_env        the variables `judge_model`'s provider reads, from .env
#   reasoning_effort none | minimal | low | medium | high | xhigh | max
#   model_args       provider arguments for `judge_model` (Inspect's -M)
#   max_tokens       the judge's output budget, thinking included
#   max_retries      how often a failed call is retried before the case
#                    errors. A provider at its usage limit answers 429 for
#                    as long as it is at it, and an unbounded retry turns
#                    that into a score phase that hangs until its budget
score_profiles:
  judge-claude-opus-5.5-high:
    judge_model: anthropic/claude-opus-5-5
    model_env: [ANTHROPIC_API_KEY]
    reasoning_effort: high
    model_args: {}
    max_tokens: 16000
    max_retries: 3

  # The same judge on a subscription token: subject to its usage limits.
  judge-claude-opus-5.5-high-subscription:
    judge_model: anthropic/claude-opus-5-5
    model_env: [ANTHROPIC_AUTH_TOKEN]
    reasoning_effort: high
    model_args: {}
    max_tokens: 16000
    max_retries: 3

  # A judge on the OpenCode Go gateway, which rejects a request without a
  # session header: `model_args` carries a fixed one, so every verdict of
  # every run groups under one session. It is a different family from the
  # Claude judges, so a verdict from one is not comparable with the other.
  judge-deepseek-flash-high:
    judge_model: openai-api/opencode-go/deepseek-v4.1-flash
    model_env: [OPENCODE_GO_API_KEY, OPENCODE_GO_BASE_URL]
    reasoning_effort: high
    model_args:
      default_headers:
        x-opencode-session: bench-trace-judge
    max_tokens: 16000
    max_retries: 3

# Same probe, but as a file so the top-level escape hatch can be set.
#
# Inspect refuses a writable host bind by default. The bench's protocol is
# exactly that (hand over a checkout, read `git diff` back), so the question
# is whether the documented opt-out actually works.
x-inspect_docker_sandbox:
  unsafe_allow_writable_host_mounts: true

services:
  default:
    image: alpine:3.20
    init: true
    command: tail -f /dev/null
    volumes:
      - ${SANDBOX_CHECKOUT}:/checkout

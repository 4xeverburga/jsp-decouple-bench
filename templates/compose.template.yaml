# templates/compose.template.yaml — the canonical stack shape.
#
# Copy this into an application as `compose.yaml`, keep the service and
# network names, and adapt only the lines marked "kept". Commit it before
# any behaviour is recorded.
#
# This is ONE repository and ONE application. The file does not describe
# two projects: it describes a deployment in which the data side can be
# isolated from the presentation side. Making that separation true in the
# code is the work; the presentation side can be refactored later without
# the data side moving.
#
#   front   presentation. The only service that publishes a host port.
#   back    data side. Owns every path to the database. It does not exist
#           yet: it is extracted from `front` when the two halves are
#           separated, and it is built from the same build context.
#   db      the database. Never published.
#
#   api     front <-> back
#   data    back <-> db
#
# `front` sits on both networks, because the application is server-rendered
# today and reads the database directly. The split into `front` + `back` is
# a change to the code, not to the topology described here.
#
# What the shape promises, whatever the sample:
#   - every container is attached only to `api` and/or `data`
#   - `db` is attached to `data` only
#   - `front` is NOT attached to `data`          <- the work
#   - only `front` publishes a host port
#   - no `network_mode:` at all (neither `host` nor `service:`)
#
# Host ports come from the environment, so a checkout can run on any free
# port without editing this file.

networks:
  api: {}
  data: {}

services:
  front:
    x-default: true
    build:
      context: .                            # kept: image or dockerfile
    networks:
      - api
      - data
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"       # kept: inner port
    # Keep the application's healthcheck, depends_on and environment: the
    # stack is polled for readiness, so a missing healthcheck makes startup
    # a race.

  db:
    image: mysql:5.7                        # kept: engine and version
    networks:
      - data
    # No `ports:`. The database is never reached from the host: it is read
    # by running a client inside the container that owns it.
    # Keep the application's volume, environment and healthcheck.

# A service needs an image or a build context, so `back` cannot be declared
# empty here. Add it when the data side is extracted:
#
#   back:
#     build:
#       context: .                          # same context — one app
#     networks:
#       - api
#       - data
#
# It must not publish a port, and it must be built from the same context as
# `front`: two build contexts would make this a rewrite instead of a split.

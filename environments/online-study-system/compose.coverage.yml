# Coverage override — used only by scripts/measure-coverage.sh:
#   docker compose -f compose.yml -f compose.coverage.yml ...
# Injects the JaCoCo agent into the Tomcat JVM via CATALINA_OPTS (the app runs
# in Tomcat, not Maven) and mounts the vendored agent.  The agent listens in
# tcpserver mode: scripts/measure-coverage.sh dumps coverage with jacococli
# without restarting the JVM (output=file is unusable here — the post-restart
# JVM truncates the file the dying one wrote).
services:
  app:
    environment:
      CATALINA_OPTS: "-javaagent:/jacoco/jacocoagent.jar=output=tcpserver,address=*,port=${COVERAGE_AGENT_PORT:-6302}"
    ports:
      - "${COVERAGE_AGENT_PORT:-6302}:${COVERAGE_AGENT_PORT:-6302}"
    volumes:
      - ../../tools/jacoco/jacocoagent.jar:/jacoco/jacocoagent.jar:ro

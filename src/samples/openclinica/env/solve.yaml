# The openclinica solve sandbox: the checkout, writable, and the PostgreSQL
# its app uses.
#
# The agent runs inside this, so it never has the docker socket and never
# sees the supervisor's home. The image is built from toolbox/Containerfile;
# the sandbox only guarantees where it may write.
#
# Writable host binds are refused by Inspect unless the project opts in:
# that is what the escape hatch below is for, and it is deliberate here.
x-inspect_docker_sandbox:
  unsafe_allow_writable_host_mounts: true

name: bench-solve-openclinica

services:
  workspace:
    x-default: true
    build:
      # The tree is the context, exactly as it is for the scoring image: the
      # toolbox warms `~/.m2` from the pin's own poms, so the agent's first
      # `mvn` is seconds instead of the cold download a multi-module reactor
      # costs. The mount below shadows whatever was copied in, so the copy in
      # the image is never what the agent reads. Built once per pin;
      # `docker compose up` reuses the image and does not rebuild it.
      context: ${BENCH_CHECKOUT:?set BENCH_CHECKOUT}
      dockerfile: ${BENCH_SAMPLE_ENV:?set by the bench}/toolbox/Containerfile
    image: bench-solve-openclinica:local
    init: true
    command: tail -f /dev/null
    volumes:
      - ${BENCH_CHECKOUT:?set BENCH_CHECKOUT}:${SOLVE_ROOT:?set SOLVE_ROOT}
    working_dir: ${SOLVE_ROOT:?set SOLVE_ROOT}

  db:
    # 9.6 on purpose: the app's 2011 driver cannot do SCRAM, which every
    # server from 10 on defaults to.
    image: postgres:9.6
    environment:
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
      POSTGRES_DB: openclinica

# Roller — the scoring stack.
#
# One host port is configurable, so the app can run on any free port without
# editing this file:
#   APP_HTTP_PORT   host port for the app   (default 8094)
#
# The database publishes nothing: it is reached from inside `data` only. It
# starts empty; the schema is the one the tree's own build generates, which
# entrypoint.sh loads on first start (the db service has no build output to
# read it from).
#
# Credentials come from this folder's .env (synthetic and deterministic).
#
# Networks:
#   api    front <-> back
#   data   back <-> db
# `front` is on both today: the app is still server-rendered and reads the
# database directly.
#
# Traces: the app runs under the OpenTelemetry Java agent (CATALINA_OPTS) and
# exports to `collector`, which writes them to the `traces` volume. Nothing
# waits on the collector's health, so a dead one cannot change what the app
# does.
name: roller

networks:
  api: {}
  data: {}

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    networks:
      - api
    # the named volume is root-owned; the image's default user is not
    user: "0"
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
      - traces:/traces

  db:
    image: mysql:5.7
    # The database MYSQL_DATABASE creates takes the server's charset; Roller
    # wants UTF-8 tables, and 5.7's default is latin1.
    command: ["--character-set-server=utf8", "--collation-server=utf8_general_ci"]
    networks:
      - data
    environment:
      MYSQL_ROOT_PASSWORD: ${ROLLER_DB_PASSWORD:?set .env (cp from .env.example)}
      MYSQL_DATABASE: ${ROLLER_DB_NAME:?set .env (cp from .env.example)}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  front:
    x-default: true
    build:
      context: ${BENCH_CHECKOUT:?set BENCH_CHECKOUT to the tree to score}
      dockerfile: ${BENCH_SAMPLE_ENV:?set by the bench}/Containerfile
      target: app
    networks:
      - api
      - data
    depends_on:
      db:
        condition: service_healthy
      collector:
        condition: service_started
    ports:
      - "${APP_HTTP_PORT:-8094}:8080"
    volumes:
      - ./entrypoint.sh:/workspace/entrypoint.sh:ro
    environment:
      # fail fast instead of booting with empty credentials
      ROLLER_DB_HOST: db
      ROLLER_DB_NAME: ${ROLLER_DB_NAME:?set .env (cp from .env.example)}
      ROLLER_DB_USER: ${ROLLER_DB_USER:?set .env (cp from .env.example)}
      ROLLER_DB_PASSWORD: ${ROLLER_DB_PASSWORD:?set .env (cp from .env.example)}
      # Tomcat's own JVM is the one that hosts the app.
      CATALINA_OPTS: -javaagent:/opt/otel/javaagent.jar
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:?set .env (cp from .env.example)}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:?set .env (cp from .env.example)}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:?set .env (cp from .env.example)}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:?set .env (cp from .env.example)}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:?set .env (cp from .env.example)}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:?set .env (cp from .env.example)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?set .env (cp from .env.example)}
    healthcheck:
      # The front page reads the site's weblogs and runtime properties, so an
      # answer from it means Tomcat deployed the context and Roller bootstrapped
      # against a schema it accepts.
      test:
        ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/roller/"]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 60s

volumes:
  db-data:
  traces:
